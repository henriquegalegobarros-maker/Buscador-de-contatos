<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact Finder ⌕</title>
</head>

<body>
    <div class="container">
        <div class="resultado"></div>
        <h2>Consulte aqui os contatos por nome ou telefone</h2>
        <br>
        <div class="input-container">
            <input placeholder="Digite aqui o nome do contato/telefone">
            <button class="add-button">ADICIONAR <span>+</span></button>
        </div>
        <div class="formulario">
            <h3>Novo contato</h3>

            <input id="nome" placeholder="Digite o nome">

            <input id="numero" placeholder="Digite o telefone">

            <button class="salvar-button">SALVAR</button>
            <button class="fechar-button">FECHAR</button>
        </div>
        <div class="search-container">
            <button class="search-button">PROCURAR <span>⌕</span></button>
            <button class="limpar-button add-button">LIMPAR CAMPOS</button>
        </div>

    </div>
    <script src="./script.js"></script>
</body>

</html>
